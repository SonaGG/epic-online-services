[package]
name = "eos-jni"
version = "1.1.1"
edition = "2021"
description = "Generic JNI/libffi bridge used by EOS for Kotlin to call the EOS SDK on Java 8+"
license = "Apache-2.0"

[lib]
name = "eos_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libffi = "5"
libc = "0.2"
once_cell = "1"
parking_lot = "0.12"

[profile.release]
# catch_unwind (see src/panic.rs) requires unwind panics - do not switch to "abort".
panic = "unwind"
lto = true
strip = true
